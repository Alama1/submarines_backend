name: api-gateway

x-app-env: &app-env
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_DB: ${POSTGRES_DB:-ff14_db}
  POSTGRES_USER: ${POSTGRES_USER:-ff14}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-ff14}:${RABBITMQ_PASS:?RABBITMQ_PASS is required}@rabbitmq:5672
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN is required}

services:
  api-gateway:
    image: ghcr.io/${IMAGE_PREFIX:-user/submarines}-api-gateway:latest
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-3000}:${API_GATEWAY_PORT:-3000}"
    environment:
      <<: *app-env
      PORT: ${API_GATEWAY_PORT:-3000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?ALLOWED_EMAILS is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
    networks:
      - submarines
    labels:
      - com.centurylinkfoundation.watchtower.enable=true

networks:
  submarines:
    external: true
