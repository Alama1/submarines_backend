name: postgres

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ff14_db}
      POSTGRES_USER: ${POSTGRES_USER:-ff14}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ff14} -d ${POSTGRES_DB:-ff14_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - submarines
    labels:
      - com.centurylinkfoundation.watchtower.enable=true

volumes:
  postgres_data:
    name: submarines_postgres_data

networks:
  submarines:
    external: true
