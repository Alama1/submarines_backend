name: order-worker

on:
  push:
    branches: [main]
    paths:
      - 'apps/order-worker/**'
      - 'packages/shared-types/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  pull_request:
    branches: [main]
    paths:
      - 'apps/order-worker/**'
      - 'packages/shared-types/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared types
        run: pnpm --filter @ff14/types build

      - name: Build order-worker
        run: pnpm --filter @ff14/order-worker build

      - name: Test order-worker
        run: pnpm --filter @ff14/order-worker test --passWithNoTests
