name: CI/CD - Build & Publish Containers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/submarines

# Cancel superseded runs so rapid pushes don't queue up worker minutes
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Detect affected services
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          ALL_SERVICES="api-gateway prices-service inventory-service orders-service recipes-service price-worker inventory-worker admin-panel"

          # Manual runs and unknown baselines rebuild everything
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || ! git rev-parse --verify --quiet "$BEFORE^{commit}" > /dev/null; then
            echo "services=$(printf '%s\n' $ALL_SERVICES | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
            echo "Baseline unavailable ($EVENT) — building all services"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files:"
          echo "$CHANGED"

          # Shared workspace code affects every service image
          SHARED='^(packages/|pnpm-lock\.yaml$|package\.json$|pnpm-workspace\.yaml$|tsconfig\.base\.json$|\.github/workflows/deploy\.yml$)'

          AFFECTED=""
          for svc in $ALL_SERVICES; do
            if echo "$CHANGED" | grep -Eq "$SHARED" || echo "$CHANGED" | grep -q "^apps/$svc/"; then
              AFFECTED="$AFFECTED $svc"
            fi
          done
          AFFECTED="${AFFECTED# }"

          if [ -z "$AFFECTED" ]; then
            echo "services=[]" >> "$GITHUB_OUTPUT"
            echo "No service-affecting changes — skipping builds"
          else
            echo "Rebuilding:$AFFECTED"
            echo "services=$(printf '%s\n' $AFFECTED | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Image Name
        id: image-name
        run: |
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}"
          echo "image_name=$(echo $IMAGE_NAME | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ steps.image-name.outputs.image_name }}:latest
            ${{ steps.image-name.outputs.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
