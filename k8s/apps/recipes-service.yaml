apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipes-service
  namespace: ff14-submarines
  labels:
    app: recipes-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recipes-service
  template:
    metadata:
      labels:
        app: recipes-service
    spec:
      containers:
        - name: recipes-service
          image: ghcr.io/alama1/recipes-service:latest
          ports:
            - containerPort: 3004
          envFrom:
            - secretRef:
                name: recipes-service-env
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3004
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: recipes-service
  namespace: ff14-submarines
spec:
  selector:
    app: recipes-service
  ports:
    - port: 3004
      targetPort: 3004
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recipes-service
  namespace: ff14-submarines
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: recipes-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
